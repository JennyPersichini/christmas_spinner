<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christmas Spinner</title>
  <link rel="icon" type="image/svg+xml" href="favicon-1.svg">
  <meta name="description" content="Un lettore musicale natalizio a forma di giradischi: premi play e scopri la sorpresa!">

  <!-- Anteprima quando il link viene condiviso (WhatsApp, Facebook, LinkedIn, Telegram...) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://christmasspinner.vercel.app/">
  <meta property="og:title" content="Christmas Spinner 🎄">
  <meta property="og:description" content="Un lettore musicale natalizio a forma di giradischi: premi play e scopri la sorpresa!">
  <meta property="og:image" content="https://christmasspinner.vercel.app/anteprima.jpg">
  <meta property="og:image:width" content="1408">
  <meta property="og:image:height" content="768">
  <meta property="og:locale" content="it_IT">
  <!-- Anteprima su X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Bootstrap + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Font natalizio -->
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Neve -->
  <div id="snow"></div>

  <main class="container d-flex flex-column align-items-center justify-content-center min-vh-100 py-4">

    <!-- Scritta Merry Christmas -->
    <h1 id="merry" class="merry">Merry Christmas</h1>

    <!-- Disco -->
    <div class="disc-wrapper mb-4">
      <div id="disc" class="disc">
        <div class="disc-label">
          <span class="label-icon">🎄</span>
        </div>
      </div>
      <!-- Braccetto del giradischi -->
      <div id="tonearm" class="tonearm"></div>
    </div>

    <!-- Info traccia -->
    <div class="text-center mb-3">
      <p id="track-title" class="track-title mb-1">—</p>
      <small id="track-count" class="track-count">0 / 0</small>
    </div>

    <!-- Barra di avanzamento -->
    <div class="w-100 progress-box mb-4">
      <div id="progress-bar" class="progress" role="progressbar">
        <div id="progress-fill" class="progress-bar"></div>
      </div>
      <div class="d-flex justify-content-between time">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Controlli -->
    <div class="d-flex gap-2 gap-sm-3 mb-4 controls">
      <button id="btn-prev"  class="btn btn-xmas" title="Traccia precedente"><i class="bi bi-skip-backward-fill"></i></button>
      <button id="btn-play"  class="btn btn-xmas" title="Play"><i class="bi bi-play-fill"></i></button>
      <button id="btn-pause" class="btn btn-xmas" title="Pausa"><i class="bi bi-pause-fill"></i></button>
      <button id="btn-stop"  class="btn btn-xmas" title="Stop"><i class="bi bi-stop-fill"></i></button>
      <button id="btn-next"  class="btn btn-xmas" title="Prossima traccia"><i class="bi bi-skip-forward-fill"></i></button>
    </div>

    <!-- Tasto Merry Christmas -->
    <button id="btn-merry" class="btn btn-gold px-4">
      <i class="bi bi-gift-fill me-2"></i>Cliccami!
    </button>

    <audio id="audio"></audio>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
